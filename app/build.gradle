plugins {
    id 'com.android.application'
}

android {
    namespace 'id.smpislamcipaku.presensipagi'
    compileSdk 35

    defaultConfig {
        applicationId 'id.smpislamcipaku.presensipagi'

        minSdk 26
        targetSdk 35

        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('presensi-pagi-key.jks')

            storePassword System.getenv('STORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false

            signingConfig signingConfigs.release

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }

        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
